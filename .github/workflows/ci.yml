name: CI

on:
  pull_request:
  push:
    branches: [main, 'dev/**']

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data and check generated files are current
        run: npm run validate
      - name: Unit and data tests
        run: npm test
